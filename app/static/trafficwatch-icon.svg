<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="TrafficWatch">
  <title>TrafficWatch</title>
  <defs>
    <radialGradient id="tw-bg" cx="35%" cy="25%" r="85%">
      <stop offset="0" stop-color="#1a2a44"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </radialGradient>
    <radialGradient id="tw-day" cx="30%" cy="30%" r="80%">
      <stop offset="0" stop-color="#1f6f8b"/>
      <stop offset="1" stop-color="#123049"/>
    </radialGradient>
    <linearGradient id="tw-arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <clipPath id="tw-globe-clip">
      <circle cx="128" cy="132" r="72"/>
    </clipPath>
    <filter id="tw-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tw-bg)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="51.25" fill="none" stroke="#243049" stroke-width="1.5"/>

  <!-- globe: day side, night side via terminator -->
  <g clip-path="url(#tw-globe-clip)">
    <circle cx="128" cy="132" r="72" fill="url(#tw-day)"/>
    <path d="M150 50 C 115 95, 115 170, 150 214 L 210 214 L 210 50 Z" fill="#070b12" opacity="0.82"/>
    <!-- graticule -->
    <g fill="none" stroke="#5eead4" stroke-opacity="0.22" stroke-width="1.5">
      <ellipse cx="128" cy="132" rx="28" ry="72"/>
      <ellipse cx="128" cy="132" rx="56" ry="72"/>
      <line x1="56" y1="132" x2="200" y2="132"/>
      <ellipse cx="128" cy="132" rx="72" ry="26"/>
    </g>
    <!-- city lights on night side -->
    <g fill="#fde68a">
      <circle cx="170" cy="112" r="1.8"/>
      <circle cx="178" cy="120" r="1.4"/>
      <circle cx="162" cy="150" r="1.6"/>
      <circle cx="185" cy="142" r="1.2"/>
      <circle cx="174" cy="165" r="1.5"/>
    </g>
  </g>
  <circle cx="128" cy="132" r="72" fill="none" stroke="#5eead4" stroke-opacity="0.55" stroke-width="2"/>

  <!-- traffic arcs -->
  <g fill="none" stroke-linecap="round" filter="url(#tw-glow)">
    <path d="M92 150 Q 118 70, 176 116" stroke="url(#tw-arc)" stroke-width="4"/>
    <path d="M92 150 Q 130 128, 170 168" stroke="#5eead4" stroke-width="3" stroke-opacity="0.8"/>
    <path d="M92 150 Q 70 96, 112 82" stroke="#fb7185" stroke-width="3.5"/>
  </g>

  <!-- home node with watch ring -->
  <circle cx="92" cy="150" r="14" fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="92" cy="150" r="6.5" fill="#5eead4" filter="url(#tw-glow)"/>
  <!-- endpoints -->
  <circle cx="176" cy="116" r="4" fill="#38bdf8"/>
  <circle cx="170" cy="168" r="3.5" fill="#5eead4"/>
  <circle cx="112" cy="82" r="4.5" fill="#fb7185" filter="url(#tw-glow)"/>

  <!-- sun marker (day/night) -->
  <circle cx="58" cy="60" r="9" fill="#fbbf24" opacity="0.95"/>
  <g stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <line x1="58" y1="42" x2="58" y2="46"/>
    <line x1="58" y1="74" x2="58" y2="78"/>
    <line x1="40" y1="60" x2="44" y2="60"/>
    <line x1="72" y1="60" x2="76" y2="60"/>
  </g>
</svg>
